spring.application.name=course-management
server.port=8081

# ===== SQL Server =====
# Sửa username/password cho đúng máy của bạn. Database phải được tạo trước (xem database/create-database.sql)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=CourseManagementDB;encrypt=true;trustServerCertificate=true
spring.datasource.username=sa
spring.datasource.password=123456
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# ===== JPA / Hibernate =====
# update: tự tạo/cập nhật 3 bảng Courses, CourseCategories, CourseImages
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
# Giữ nguyên tên bảng/cột như khai báo (Courses, TuitionFee, ...)
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Dùng NVARCHAR để lưu tiếng Việt có dấu
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.open-in-view=false
# In câu SQL ra console -> chứng minh việc lọc được thực hiện bằng câu WHERE trong database
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===== Không hiển thị lỗi hệ thống ra màn hình =====
server.error.whitelabel.enabled=false
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-exception=false

spring.thymeleaf.cache=false
