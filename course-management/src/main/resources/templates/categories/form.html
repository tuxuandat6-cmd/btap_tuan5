<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${category.id == null ? 'Thêm loại khóa học' : 'Sửa loại khóa học'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 640px">
    <h1 class="h3 mb-3" th:text="${category.id == null} ? 'Thêm loại khóa học' : 'Sửa loại khóa học'"></h1>

    <form class="card card-body" method="post" th:object="${category}" novalidate
          th:action="${category.id == null} ? @{/categories/create} : @{/categories/{id}/edit(id=${category.id})}">
        <div class="mb-3">
            <label class="form-label" for="name">Tên loại <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>
        <div class="mb-4">
            <label class="form-label" for="description">Mô tả</label>
            <textarea class="form-control" rows="3" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>
        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-outline-secondary" th:href="@{/categories}">Hủy</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
