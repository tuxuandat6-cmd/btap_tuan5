<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(${courseForm.id == null ? 'Thêm khóa học' : 'Sửa khóa học'})}"></head>
<body>
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="container pb-5" style="max-width: 760px">
    <h1 class="h3 mb-3" th:text="${courseForm.id == null} ? 'Thêm khóa học' : 'Sửa khóa học'"></h1>

    <form class="card card-body" method="post" th:object="${courseForm}" novalidate
          th:action="${courseForm.id == null} ? @{/courses/create} : @{/courses/{id}/edit(id=${courseForm.id})}">

        <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger">
            Dữ liệu không hợp lệ, vui lòng kiểm tra lại các trường được đánh dấu.
            <div th:each="err : ${#fields.globalErrors()}" th:text="${err}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="name">Tên khóa học <span class="text-danger">*</span></label>
            <input type="text" class="form-control" th:field="*{name}" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{name}"></div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="categoryId">Loại khóa học <span class="text-danger">*</span></label>
            <select class="form-select" th:field="*{categoryId}" th:errorclass="is-invalid">
                <option value="">-- Chọn loại khóa học --</option>
                <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"></option>
            </select>
            <div class="invalid-feedback" th:errors="*{categoryId}"></div>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label class="form-label" for="tuitionFee">Học phí (VNĐ) <span class="text-danger">*</span></label>
                <input type="text" inputmode="numeric" class="form-control" th:field="*{tuitionFee}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{tuitionFee}"></div>
            </div>
            <div class="col-md-6 mb-3">
                <label class="form-label" for="duration">Thời lượng (giờ) <span class="text-danger">*</span></label>
                <input type="text" inputmode="numeric" class="form-control" th:field="*{duration}"
                       th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{duration}"></div>
                <div class="form-text">≤ 30 giờ: Ngắn hạn; &gt; 30 giờ: Dài hạn</div>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label" for="description">Mô tả</label>
            <textarea class="form-control" rows="4" th:field="*{description}" th:errorclass="is-invalid"></textarea>
            <div class="invalid-feedback" th:errors="*{description}"></div>
        </div>

        <div class="form-check form-switch mb-4">
            <input class="form-check-input" type="checkbox" th:field="*{active}">
            <label class="form-check-label" th:for="${#ids.prev('active')}">Đang tuyển sinh</label>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a class="btn btn-outline-secondary"
               th:href="${courseForm.id == null} ? @{/courses} : @{/courses/{id}(id=${courseForm.id})}">Hủy</a>
        </div>
    </form>
</main>

<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
